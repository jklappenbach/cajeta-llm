# The cpu leg of the cajeta-llm suite on the proton-amd box: both passes
# (test profile, then --release --live-set=bounded) and the census, on the
# cpu backend, under the enforcing kernel gate. A leg run with
# CAJETA_XPU_KERNEL_GATE=warn reads green while a kernel that fails to
# lower stays hidden (2026-09-30), so this one never sets it. The box has
# 16 cpu lanes, where the 2026-10-02 bugs lived; 8-lane hosts never saw them.
#
# Runs on every push to main, on every v* tag (the version-bump commit and
# the tag both run it, so a release is preceded by a green leg) and on
# dispatch. The runner must carry the `llm` label. Register one for THIS
# repository on proton, beside the cajeta runner:
#
#     ./config.sh --url https://github.com/jklappenbach/cajeta-llm \
#                 --token <Settings > Actions > Runners > New> \
#                 --name proton-amd-llm --labels amd,gfx1151,llm
#
# Until one does, a run queues rather than failing, which is the honest
# state: nothing claims to have run the leg.
#
# The compiler is the released cajeta named by .cajeta-version (or the
# dispatch input), fetched from its GitHub release, never a local build:
# the leg tests what a consumer of the published package gets. The library
# dependencies resolve as run-tests.sh always has: a sibling checkout when
# present, else the Olla store, else the registry.
name: cpu-leg

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      cajeta-version:
        description: 'cajeta release tag to test against (empty: .cajeta-version)'
        required: false
        default: ''
      filter:
        description: 'CAJETA_UNIT_FILTER substrings; a partial run skips the census and the release pass'
        required: false
        default: ''

concurrency:
  group: cpu-leg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu:
    name: cpu (proton-amd)
    runs-on: [self-hosted, Linux, llm]
    timeout-minutes: 360
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the pinned cajeta release
        env:
          INPUT_VERSION: ${{ inputs.cajeta-version }}
        run: |
          set -euo pipefail
          V="${INPUT_VERSION:-$(tr -d '[:space:]' < .cajeta-version)}"
          ASSET="cajeta-${V}-x86_64-linux-gnu"
          URL="https://github.com/jklappenbach/cajeta/releases/download/${V}/${ASSET}.tar.gz"
          DEST="$RUNNER_TEMP/cajeta-${V}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          curl -fsSL "$URL" | tar -xz -C "$DEST" --strip-components=1
          "$DEST/bin/cajeta" --version
          echo "CAJETA=$DEST/bin/cajeta" >> "$GITHUB_ENV"
          echo "cajeta: $V" >> "$GITHUB_STEP_SUMMARY"

      - name: Both passes and the census, cpu, gated
        env:
          XPU_BACKEND: cpu
          RELEASE_PASS: '1'
          PROGRESS: '300'
          CAJETA_UNIT_FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          export TMPDIR="$RUNNER_TEMP"
          unset CAJETA_XPU_KERNEL_GATE
          ./run-tests.sh 2>&1 | tee cpu-leg.log

      - name: Summarise
        if: always()
        run: |
          set -euo pipefail
          [ -f cpu-leg.log ] || { echo "::error::no leg log was written"; exit 1; }
          {
            echo "### cpu leg"
            echo ""
            echo '```'
            grep -E '^Tests: |census|uncovered|stale|xpu-kernel-skipped' cpu-leg.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if ! grep -qE '^Tests: [1-9][0-9]* passed' cpu-leg.log; then
            echo "::error::no pass line in the log, so the leg ran nothing"
            exit 1
          fi

      - name: Upload the log and the census table
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cpu-leg
          path: |
            cpu-leg.log
            build/census-cpu.tsv
          if-no-files-found: ignore
